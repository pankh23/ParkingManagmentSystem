# Database Configuration (supports environment variables for deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parkingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parkinguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parkingpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration (using XML config, so JPA auto-config is disabled)
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

# Razorpay Configuration (supports environment variables)
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_1234567890}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:test_secret_1234567890}

# Email Configuration (supports environment variables)
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:noreply@apcparking.com}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.host=${MAIL_HOST:smtp.gmail.com}
mail.port=${MAIL_PORT:587}

# SMS Configuration
app.sms.enabled=false

# Application Configuration
app.name=APC Parking Management System
app.version=2.0.0

# Logging Configuration (production-friendly defaults)
logging.level.com.apc.parking=${LOG_LEVEL:INFO}
logging.level.org.springframework=${SPRING_LOG_LEVEL:WARN}
logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:WARN}

# Scheduler Configuration
spring.task.scheduling.pool-size=10
spring.task.execution.pool-size=5

# Concurrency Configuration
app.concurrency.max-retries=3
app.concurrency.retry-delay=50

# JWT Configuration (supports environment variables - use strong secret in production)
jwt.secret=${JWT_SECRET:APCParkingManagementSystemSecretKeyForJWTTokenGeneration2024SecureKey}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Server Configuration (Render uses PORT environment variable)
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
