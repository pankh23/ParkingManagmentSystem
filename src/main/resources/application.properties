# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/parkingdb
spring.datasource.username=parkinguser
spring.datasource.password=parkingpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration (using XML config, so JPA auto-config is disabled)
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

# Razorpay Configuration
razorpay.key_id=rzp_test_1234567890
razorpay.key_secret=test_secret_1234567890

# Email Configuration
app.email.enabled=false
app.email.from=noreply@apcparking.com
mail.username=
mail.password=
mail.host=smtp.gmail.com
mail.port=587

# SMS Configuration
app.sms.enabled=false

# Application Configuration
app.name=APC Parking Management System
app.version=2.0.0

# Logging Configuration
logging.level.com.apc.parking=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

# Scheduler Configuration
spring.task.scheduling.pool-size=10
spring.task.execution.pool-size=5

# Concurrency Configuration
app.concurrency.max-retries=3
app.concurrency.retry-delay=50

# JWT Configuration
jwt.secret=APCParkingManagementSystemSecretKeyForJWTTokenGeneration2024SecureKey
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
