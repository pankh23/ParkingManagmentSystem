services:
  - type: web
    name: parking-system-backend
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/APCParkingSystem-1.0-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: parking-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: parking-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: parking-db
          property: password
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: APP_EMAIL_ENABLED
        value: "false"

databases:
  - name: parking-db
    databaseName: parkingdb
    user: parkinguser
    plan: free

