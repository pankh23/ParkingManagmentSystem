services:
  - type: web
    name: parking-system-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: parking-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: parking-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: parking-db
          property: password
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: APP_EMAIL_ENABLED
        value: "false"

# If parking-db is suspended (free tier expired), upgrade it in Render Dashboard
# or create a new PostgreSQL and set SPRING_DATASOURCE_* in the web service env.
# See DATABASE_SETUP.md for steps.
databases:
  - name: parking-db
    databaseName: parkingdb
    user: parkinguser
    plan: free  # free tier can expire; upgrade or create new DB and update env vars

